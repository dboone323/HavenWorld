# =============================================================================
# HavenWorld — Production Cloudflare Named Tunnel Configuration Template
# =============================================================================
# Replace <TUNNEL_UUID> with the UUID generated by:
#   cloudflared tunnel create havenworld-prod
#
# Copy this file to ~/.cloudflared/config.yml or /etc/cloudflared/config.yml
# =============================================================================

tunnel: <TUNNEL_UUID>
credentials-file: /home/ubuntu/.cloudflared/<TUNNEL_UUID>.json

# Ingress rules evaluate top-to-bottom. The first matching rule applies.
ingress:
  # Game server & WebSockets (Socket.io)
  - hostname: play.havenworld.me
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      http2Origin: false

  # REST API & Auth endpoints
  - hostname: api.havenworld.me
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      http2Origin: false

  # Primary apex domain (if routing directly through server rather than Cloudflare Pages)
  - hostname: havenworld.me
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      http2Origin: false

  # Catch-all rule (required by cloudflared as the final entry)
  - service: http_status:404
