# /etc/nginx/sites-available/havenworld — HavenWorld Production Configuration
# Managed by deploy/nginx/havenworld-production.conf in the repo.
# Applied via scripts/server-setup.sh
#
# NOTE: Rate-limit zones (login, api, ws) and server_tokens are set in
# /etc/nginx/nginx.conf http block by server-setup.sh.

# ── HTTP: Redirect all traffic to HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 147-224-145-168.nip.io;

    # Certbot ACME challenge (must stay HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name 147-224-145-168.nip.io;

    # ── TLS (Certbot-managed) ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/147-224-145-168.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/147-224-145-168.nip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── OCSP Stapling ─────────────────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss://147-224-145-168.nip.io https://havenworld-game.pages.dev; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Request Size Limits ───────────────────────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout  12s;
    client_header_timeout 12s;

    # ── Auth endpoints (strict rate limiting) ─────────────────────────────────
    location /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;

        limit_except POST GET OPTIONS {
            deny all;
        }

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── General API (moderate rate limiting) ──────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket / Socket.io ─────────────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=ws burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_connect_timeout  75s;
    }

    # ── Health check (no rate limit, no access log) ───────────────────────────
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    # ── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        keepalive_timeout 3600s;
    }
}
