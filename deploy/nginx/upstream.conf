# ─────────────────────────────────────────────────────────────────────────────
# HavenWorld — Nginx upstream for zero-downtime rolling deploys (Part 9A §4.3)
#
# Include this inside the `http {}` block of /etc/nginx/nginx.conf, then point
# the server block's `proxy_pass` at http://havenworld_backend (see
# havenworld.conf). `ip_hash` keeps a browser on one PM2 worker for the life of
# its WebSocket session, which is what makes multi-worker Socket.io safe.
#
# Single worker (PM2_INSTANCES=1):
#   server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
#
# Multi-worker (after adding the Redis adapter):
#   server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
#   server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
# ─────────────────────────────────────────────────────────────────────────────

upstream havenworld_backend {
    ip_hash;
    keepalive 32;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
}

# WebSocket upgrade helper — reused by the /socket.io/ location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
