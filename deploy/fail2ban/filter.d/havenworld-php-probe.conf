# /etc/fail2ban/filter.d/havenworld-php-probe.conf
# Bans IPs probing for PHP scripts, web shells, or unauthenticated exploit vectors.

[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) .*\.(php|phtml|phar|asp|aspx|jsp|cgi).* HTTP/.*" (400|403|404|444) .*$
            ^<HOST> .* "(GET|POST|HEAD) .*(eval-stdin|phpmyadmin|wp-login|phpinfo|_profiler|actuator).* HTTP/.*" (400|403|404|444) .*$
ignoreregex =
