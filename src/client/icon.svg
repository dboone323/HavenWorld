<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Isometric Diamond Base -->
  <polygon points="256,120 420,210 256,300 92,210" fill="url(#roof)" opacity="0.9"/>
  <polygon points="92,210 256,300 256,410 92,320" fill="#6d28d9"/>
  <polygon points="420,210 256,300 256,410 420,320" fill="#4c1d95"/>
  <!-- Glowing Floating Sanctuary Crystal -->
  <polygon points="256,140 310,210 256,280 202,210" fill="url(#glow)"/>
  <!-- Star sparkle -->
  <circle cx="256" cy="100" r="14" fill="#fef08a"/>
  <circle cx="360" cy="140" r="8" fill="#fde047"/>
  <circle cx="150" cy="150" r="7" fill="#fde047"/>
</svg>
