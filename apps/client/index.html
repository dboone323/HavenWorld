<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HavenWorld — a cozy social world where you can hang out, explore, and express yourself." />
  <title>HavenWorld</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🌿</text></svg>" />
</head>
<body>

  <!-- ══ Game Canvas ══════════════════════════════════════════════════════ -->
  <div id="game-container" class="hidden"></div>

  <!-- ══ Login Panel ══════════════════════════════════════════════════════ -->
  <div id="login-panel" class="panel hidden">
    <h1 style="text-align:center; margin-bottom:1.5rem; color:#4ecdc4; font-size:1.75rem;">🌿 HavenWorld</h1>

    <div class="login-tabs">
      <button id="tab-login"    class="tab tab--active">Sign In</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <!-- Login form -->
    <form id="form-login">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn--teal" style="width:100%; margin-top:0.5rem;" data-label="Sign In">Sign In</button>
    </form>

    <!-- Register form -->
    <form id="form-register" class="hidden">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" autocomplete="username" placeholder="CoolHaven42" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" placeholder="Min 8 characters" required />
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required />
      </div>
      <div class="form-group">
        <label for="reg-invite">Invite Code</label>
        <input id="reg-invite" type="text" autocomplete="off" placeholder="ALPHA-CODE (optional if open)" />
      </div>
      <button type="submit" class="btn btn--teal" style="width:100%; margin-top:0.5rem;" data-label="Create Account">Create Account</button>
    </form>

    <p id="login-error" class="error-text" style="min-height:1.2em;"></p>

    <p style="text-align:center; margin-top:1rem; font-size:0.75rem; color:#7070a0;">
      By continuing you agree to our
      <a href="terms.html" style="color:#4ecdc4;" target="_blank">Terms</a> &amp;
      <a href="privacy.html" style="color:#4ecdc4;" target="_blank">Privacy Policy</a>.
    </p>
  </div>

  <!-- ══ Lobby Panel ═══════════════════════════════════════════════════════ -->
  <div id="lobby-panel" class="hidden">
    <div class="lobby-header">
      <span class="lobby-title">🌐 Choose a Room</span>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <button id="btn-logout" class="btn btn--ghost" style="font-size:0.8rem;">Sign Out</button>
      </div>
    </div>
    <div id="room-grid"></div>
  </div>

  <!-- ══ Room Nav (in-game top bar) ════════════════════════════════════════ -->
  <div id="room-nav" class="hidden">
    <button id="btn-lobby"  class="btn btn--ghost" style="font-size:0.8rem;">🗺 Lobby</button>
    <button id="btn-avatar" class="btn btn--ghost" style="font-size:0.8rem;">👗 Wardrobe</button>
    <button id="btn-logout" class="btn btn--ghost" style="font-size:0.8rem;">✕ Sign Out</button>
  </div>

  <!-- ══ Player Card (in-game top right) ═══════════════════════════════════ -->
  <div id="player-card" class="hidden">
    <span>🌿</span>
    <span class="player-card__username"></span>
  </div>

  <!-- ══ Chat Panel ════════════════════════════════════════════════════════ -->
  <div id="chat-panel" class="hidden">
    <div id="chat-log" aria-live="polite" aria-label="Chat messages"></div>
    <p id="chat-error" class="hidden"></p>
    <div class="chat-input-row">
      <input id="chat-input" type="text" maxlength="200" placeholder="Say something…" aria-label="Chat input" />
      <button id="chat-send" class="btn btn--teal" style="padding:0.3rem 0.7rem; font-size:0.8rem;">Send</button>
    </div>
  </div>

  <!-- ══ Avatar Customizer Panel ═══════════════════════════════════════════ -->
  <div id="avatar-panel" class="hidden"></div>

  <!-- ══ Entry Point ════════════════════════════════════════════════════════ -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
