<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HavenWorld — a cozy social world where you can hang out, explore, and express yourself." />
  <title>HavenWorld</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4ecdc4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HavenWorld" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🌿</text></svg>" />
</head>
<body>

  <!-- ══ Game Canvas ══════════════════════════════════════════════════════ -->
  <div id="game-container" class="hidden" data-testid="game-container">
    <canvas id="haven-canvas" data-testid="haven-canvas"></canvas>
  </div>

  <!-- ══ Login Panel ══════════════════════════════════════════════════════ -->
  <div id="login-panel" class="panel hidden" data-testid="login-panel">
    <h1 style="text-align:center; margin-bottom:1.5rem; color:#4ecdc4; font-size:1.75rem;">🌿 HavenWorld</h1>

    <div class="login-tabs">
      <button id="tab-login" class="tab tab--active" data-testid="tab-login">Sign In</button>
      <button id="tab-register" class="tab" data-testid="tab-register">Register</button>
    </div>

    <!-- Login form -->
    <form id="form-login" data-testid="form-login">
      <div class="form-group">
        <label for="login-email">Email or Username</label>
        <input id="login-email" type="text" autocomplete="username" placeholder="you@example.com or Username" data-testid="login-email" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" data-testid="login-password" required />
      </div>
      <button id="login-submit" type="submit" class="btn btn--teal" style="width:100%; margin-top:0.5rem;" data-label="Sign In" data-testid="login-submit">Sign In</button>
    </form>

    <!-- Register form -->
    <form id="form-register" class="hidden" data-testid="form-register">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" autocomplete="username" placeholder="CoolHaven42" data-testid="reg-username" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" data-testid="reg-email" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" placeholder="Min 8 characters" data-testid="reg-password" required />
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" autocomplete="new-password" placeholder="Repeat password" data-testid="reg-confirm" required />
      </div>
      <div class="form-group">
        <label for="reg-invite">Invite Code</label>
        <input id="reg-invite" type="text" autocomplete="off" placeholder="ALPHA-CODE (optional if open)" data-testid="reg-invite" />
      </div>
      <button id="reg-submit" type="submit" class="btn btn--teal" style="width:100%; margin-top:0.5rem;" data-label="Create Account" data-testid="reg-submit">Create Account</button>
    </form>

    <p id="login-error" class="error-text" style="min-height:1.2em;" data-testid="login-error"></p>

    <p style="text-align:center; margin-top:1rem; font-size:0.75rem; color:#7070a0;">
      By continuing you agree to our
      <a href="terms.html" style="color:#4ecdc4;" target="_blank">Terms</a> &amp;
      <a href="privacy.html" style="color:#4ecdc4;" target="_blank">Privacy Policy</a>.
    </p>
  </div>

  <!-- ══ Lobby Panel ═══════════════════════════════════════════════════════ -->
  <div id="lobby-panel" class="hidden" data-testid="lobby-panel">
    <div class="lobby-header">
      <span class="lobby-title">🌐 Travel &amp; Directory</span>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <button id="btn-close-lobby" class="btn btn--ghost" style="font-size:0.8rem;" data-testid="btn-close-lobby">✕ Close</button>
        <button id="btn-lobby-logout" class="btn btn--ghost" style="font-size:0.8rem;" data-testid="btn-lobby-logout">Sign Out</button>
      </div>
    </div>
    <div class="login-tabs" style="margin-bottom: 1rem;">
      <button id="tab-rooms-public" class="tab tab--active" data-testid="tab-rooms-public">Public Space</button>
      <button id="tab-rooms-lofts" class="tab" data-testid="tab-rooms-lofts">Community Lofts</button>
    </div>
    <div id="room-grid" data-testid="room-grid"></div>
  </div>

  <!-- ══ Top Left Room Info Pill (MegaPlanet Style) ════════════════════════ -->
  <div id="room-info-pill" class="hud-room-info hidden">
    <div class="room-pill-main">
      <span class="room-pill-icon">🏡</span>
      <span id="room-name-display" class="room-pill-title">My Sanctuary Loft</span>
    </div>
    <div class="room-pill-sub">
      <span id="room-badge-type" class="room-sub-badge">Personal Room</span>
      <span id="room-badge-occupants" class="room-sub-badge">👥 1</span>
    </div>
  </div>

  <!-- ══ Top Right Status & Currency Stack (MegaPlanet Style) ══════════════ -->
  <div id="player-card" class="hud-status-stack hidden" data-testid="player-card">
    <div class="status-pill status-pill--coins" title="HavenCoins Balance">
      <span class="pill-icon">🪙</span>
      <span id="coin-balance"><span id="coin-amount">120</span></span>
      <button class="pill-plus-btn" id="btn-quick-shop-coins" title="Earn or Buy Coins">+</button>
    </div>
    <div class="status-pill status-pill--gems" title="HavenGems Balance">
      <span class="pill-icon">💎</span>
      <span id="gem-amount">0</span>
      <button class="pill-plus-btn" id="btn-quick-shop-gems" title="Buy HavenGems">+</button>
    </div>
    <div class="status-pill status-pill--stars" title="Citizen Level & Rep">
      <span class="pill-icon">⭐</span>
      <span id="rep-level">Lv. 1</span>
    </div>
    <div class="status-pill status-pill--user" title="Citizen Passport">
      <span class="pill-icon">🌿</span>
      <span class="player-card__username" data-testid="player-card-username">Citizen</span>
    </div>
  </div>

  <!-- ══ HUD Docks Wrapper (Preserves #room-nav id for test compatibility) ══ -->
  <div id="room-nav" class="hidden" data-testid="room-nav">
    <!-- Left Vertical Floating Dock -->
    <div id="dock-left" class="hud-dock hud-dock--left">
      <button id="btn-my-loft" class="dock-btn" data-tooltip="My Loft" data-testid="btn-my-loft">
        <span class="dock-icon">🏠</span>
      </button>
      <button id="btn-browse-lofts" class="dock-btn" data-tooltip="Visit Lofts" data-testid="btn-browse-lofts">
        <span class="dock-icon">🏢</span>
      </button>
      <button id="btn-clubs" class="dock-btn" data-tooltip="Clubs" data-testid="btn-clubs">
        <span class="dock-icon">👥</span>
      </button>
      <button id="btn-daily-gift" class="dock-btn dock-btn--badge" data-tooltip="Daily Bonus" data-testid="btn-daily-gift">
        <span class="dock-icon">🎁</span>
        <span class="dock-badge">1</span>
      </button>
      <button id="btn-shop" class="dock-btn" data-tooltip="Emporium Shop" data-testid="btn-shop">
        <span class="dock-icon">🛍️</span>
      </button>
      <button id="btn-decorate" class="dock-btn hidden" data-tooltip="Decorate Loft" data-testid="btn-decorate">
        <span class="dock-icon">🛋️</span>
      </button>
      <button id="btn-avatar" class="dock-btn" data-tooltip="Wardrobe & Avatar" data-testid="btn-avatar">
        <span class="dock-icon">👗</span>
      </button>
      <button id="btn-pizza" class="dock-btn" data-tooltip="Pizza Chef Job" data-testid="btn-pizza">
        <span class="dock-icon">🍕</span>
      </button>
      <button id="btn-toggle-chat" class="dock-btn" data-tooltip="Toggle Chat" data-testid="btn-toggle-chat">
        <span class="dock-icon">💬</span>
      </button>
      <button id="btn-toggle-dm" class="dock-btn dock-btn--badge" data-tooltip="Direct Messages" data-testid="btn-toggle-dm">
        <span class="dock-icon">✉️</span>
        <span id="dm-unread-badge" class="dock-badge" style="display: none;">0</span>
      </button>
    </div>

    <!-- Right Vertical Floating Dock -->
    <div id="dock-right" class="hud-dock hud-dock--right">
      <button id="btn-park" class="dock-btn" data-tooltip="Haven Park" data-testid="btn-park">
        <span class="dock-icon">🌳</span>
      </button>
      <button id="btn-passport" class="dock-btn" data-tooltip="Citizen Passport" data-testid="btn-passport">
        <span class="dock-icon">🛂</span>
      </button>
      <button id="btn-gallery" class="dock-btn" data-tooltip="Haven Gallery" data-testid="btn-gallery">
        <span class="dock-icon">📷</span>
      </button>
      <button id="btn-workshop" class="dock-btn" data-tooltip="Crafting Workshop" data-testid="btn-workshop">
        <span class="dock-icon">🔨</span>
      </button>
      <button id="btn-pets" class="dock-btn" data-tooltip="Pet Companions" data-testid="btn-pets">
        <span class="dock-icon">🐾</span>
      </button>
      <button id="btn-fishing" class="dock-btn hidden" data-tooltip="Go Fishing" data-testid="btn-fishing">
        <span class="dock-icon">🎣</span>
      </button>
      <button id="btn-loft-settings" class="dock-btn hidden" data-tooltip="Loft Settings" data-testid="btn-loft-settings">
        <span class="dock-icon">⚙️</span>
      </button>
      <button id="btn-nav-logout" class="dock-btn dock-btn--danger" data-tooltip="Sign Out" data-testid="btn-nav-logout">
        <span class="dock-icon">🚪</span>
      </button>
    </div>

    <!-- Bottom Left Room Controls Card (MegaPlanet style) -->
    <div id="room-controls-card" class="hud-room-controls hidden">
      <div class="controls-card-header">
        <span>🏠 Room Controls</span>
      </div>
      <div class="controls-card-row">
        <span>Lock Room</span>
        <label class="switch">
          <input type="checkbox" id="chk-room-lock">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="controls-card-row">
        <button id="btn-quick-mood" class="btn-card-action">🎭 Set Room Mood</button>
      </div>
    </div>
  </div>

  <!-- ══ Modals & Panels ═══════════════════════════════════════════════════ -->
  <div id="workshop-panel" class="hidden" data-testid="workshop-panel"></div>
  <div id="pet-panel" class="hidden" data-testid="pet-panel"></div>
  <div id="club-panel" class="hidden" data-testid="club-panel"></div>
  <div id="gallery-panel" class="hidden" data-testid="gallery-panel"></div>
  <div id="loft-settings-panel" class="hidden" data-testid="loft-settings-panel"></div>

  <!-- ══ Chat Panel ════════════════════════════════════════════════════════ -->
  <div id="chat-panel" class="hidden" data-testid="chat-panel">
    <div id="chat-log" aria-live="polite" aria-label="Chat messages" data-testid="chat-log"></div>
    <p id="chat-error" class="hidden" data-testid="chat-error"></p>
    <div class="chat-input-row">
      <input id="chat-input" type="text" maxlength="200" placeholder="Say something…" aria-label="Chat input" data-testid="chat-input" />
      <button id="chat-send" class="btn btn--teal" style="padding:0.3rem 0.7rem; font-size:0.8rem;" data-testid="chat-send">Send</button>
    </div>
  </div>

  <!-- ══ Avatar Customizer Panel ═══════════════════════════════════════════ -->
  <div id="avatar-panel" class="hidden" data-testid="avatar-panel"></div>

  <!-- ══ Entry Point ════════════════════════════════════════════════════════ -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
