name: Nightly E2E Cross-Browser & Performance Matrix

on:
  schedule:
    - cron: '0 4 * * *' # Every night at 04:00 UTC
  workflow_dispatch:

jobs:
  matrix-e2e:
    name: Nightly Multi-Browser Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: havenworld_test
          POSTGRES_USER: havenworld_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://havenworld_user:test_password@localhost:5432/havenworld_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci_jwt_secret_not_for_production
      JWT_ACCESS_SECRET: ci_jwt_secret_not_for_production
      JWT_REFRESH_SECRET: ci_refresh_secret_not_for_production
      NODE_ENV: test
      PORT: 3000
      BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter '@havenworld/shared' build

      - name: Generate Prisma client & Push DB
        run: |
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma db push --accept-data-loss

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright Test Matrix
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.project }}-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
