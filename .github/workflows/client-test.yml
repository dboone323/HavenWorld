name: Client Tests & Coverage

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - '.github/workflows/client-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - '.github/workflows/client-test.yml'

jobs:
  client-test:
    name: Vitest Client Unit & NullEngine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter '@havenworld/shared' build

      - name: Run Client Vitest with Coverage
        run: pnpm test:client:coverage

      - name: Upload Client Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage-${{ github.sha }}
          path: apps/client/coverage/
          retention-days: 14
