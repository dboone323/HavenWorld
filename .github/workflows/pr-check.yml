name: PR Check — Tests & Coverage

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://havenworld_user:@localhost:5432/havenworld_test
  JWT_SECRET: 
  JWT_ACCESS_SECRET: 
  JWT_REFRESH_SECRET: 
  REDIS_URL: redis://localhost:6379/1
  NODE_ENV: test
  PORT: 3001

jobs:
  test:
    name: Jest Test Suite & CI Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: havenworld_test
          POSTGRES_USER: havenworld_user
          POSTGRES_PASSWORD: ${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Generate per-run credentials and write to GITHUB_ENV
        run: |
          DB_PASSWORD="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          DATABASE_URL="postgresql://havenworld_user:${DB_PASSWORD}@localhost:5432/havenworld_test"
          echo "DATABASE_URL=${DATABASE_URL}" >> $GITHUB_ENV
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${JWT_SECRET}" >> $GITHUB_ENV
          JWT_ACCESS_SECRET=$(openssl rand -hex 32)
          echo "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" >> $GITHUB_ENV
          JWT_REFRESH_SECRET=$(openssl rand -hex 32)
          echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter '@havenworld/shared' build

      - name: Generate Prisma client
        run: pnpm --filter server exec prisma generate

      - name: Run Prisma migrations & seed on test database
        run: |
          pnpm --filter server exec prisma db push --accept-data-loss
          pnpm --filter server exec npx tsx prisma/seed.ts

      - name: TypeScript build check
        run: pnpm --filter server exec tsc --noEmit --project tsconfig.test.json

      - name: Run Jest test suite with coverage
        run: pnpm --filter server run test:coverage

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: apps/server/coverage/
          retention-days: 14

  client-check:
    name: Client — TypeScript, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter '@havenworld/shared' build

      - name: Client — TypeScript check
        run: pnpm --filter client exec tsc --noEmit

      - name: Client — Lint
        run: pnpm --filter client lint

      - name: Client — Unit tests
        run: pnpm --filter client test

  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
