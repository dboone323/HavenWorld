name: Deploy Server to Oracle VM

on:
  push:
    branches: [main]
    paths: ['apps/server/**', 'packages/shared/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter server lint

      - run: pnpm --filter server test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            APP_DIR="/opt/havenworld"
            LOG_DIR="$APP_DIR/logs"
            echo "[deploy] $(date '+%Y-%m-%d %H:%M:%S') — starting"
            cd "$APP_DIR"
            echo "[deploy] git pull origin main"
            sudo -u havenworld git pull origin main
            echo "[deploy] pnpm install"
            sudo -u havenworld pnpm install --frozen-lockfile
            echo "[deploy] build shared package"
            sudo -u havenworld pnpm --filter '@havenworld/shared' build
            echo "[deploy] prisma generate + migrate deploy"
            sudo -u havenworld pnpm --filter server exec prisma generate
            sudo -u havenworld pnpm --filter server exec prisma migrate deploy
            echo "[deploy] build server"
            sudo -u havenworld pnpm --filter server build
            mkdir -p "$LOG_DIR"
            echo "[deploy] pm2 reload / start"
            if sudo -u havenworld pm2 describe havenworld-server > /dev/null 2>&1; then
              sudo -u havenworld pm2 reload havenworld-server --update-env
            else
              sudo -u havenworld pm2 start "$APP_DIR/ecosystem.config.js"
            fi
            sudo -u havenworld pm2 save
            echo "[deploy] $(date '+%Y-%m-%d %H:%M:%S') — complete ✓"
            sudo -u havenworld pm2 list
