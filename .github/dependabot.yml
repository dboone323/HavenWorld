version: 2
updates:
  # Root pnpm workspace dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'security'
    groups:
      patch-updates:
        update-types:
          - 'patch'
    ignore:
      - dependency-name: 'socket.io'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'socket.io-client'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # Server dependencies
  - package-ecosystem: 'npm'
    directory: '/apps/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(server-deps)'
      include: 'scope'
    labels:
      - 'server'
      - 'dependencies'
    groups:
      patch-updates:
        update-types:
          - 'patch'
    ignore:
      - dependency-name: 'socket.io'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # Client dependencies
  - package-ecosystem: 'npm'
    directory: '/apps/client'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(client-deps)'
      include: 'scope'
    labels:
      - 'client'
      - 'dependencies'
    groups:
      patch-updates:
        update-types:
          - 'patch'

  # Shared package dependencies
  - package-ecosystem: 'npm'
    directory: '/packages/shared'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(shared-deps)'
      include: 'scope'
    labels:
      - 'shared'
      - 'dependencies'
    groups:
      patch-updates:
        update-types:
          - 'patch'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - 'ci'
      - 'dependencies'
